<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mystic Sister Oracle</title>
  <script
    src="https://thunkable.github.io/webviewer-extension/thunkableWebviewerExtension.js"
    type="text/javascript"
  ></script>

  <style>
    @font-face {
      font-family: 'RotundaVeneta';
      src: url('fonts/RotundaVeneta.woff2') format('woff2'),
           url('fonts/RotundaVeneta.woff') format('woff');
      font-weight: normal;
      font-style: normal;
    }

    .rotunda {
      font-family: 'RotundaVeneta', 'Georgia', serif;
      letter-spacing: 0.5px;
    }

    body {
      background-color: #FFFBF5;
      color: #000;
      font-family: 'Georgia', serif;
      line-height: 1.55;
      margin: 0;
      padding: 20px;
      text-align: left;
      overflow-x: hidden;
    }

    #top-center {
      padding-top: 60px;
      text-align: center;
    }

    #listening {
      font-size: 1.6em;
      font-family: 'RotundaVeneta', 'Georgia', serif;
    }

    #loading {
      margin-top: 16px;
      height: 180px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 120ms ease-in;
    }

    #loading.is-visible {
      opacity: 1;
      pointer-events: auto;
    }

    #loading img {
      width: 180px;
      height: 180px;
      opacity: 0.9;
    }

    #loading-text {
      margin-top: 14px;
      font-size: 1.2em;
      text-align: center;
      opacity: 0;
      transition: opacity 600ms ease;
      color: #282120;
    }

    .pulse {
      animation: softPulse 2.4s ease-in-out infinite;
    }

    @keyframes softPulse {
      0%   { opacity: 0.85; }
      50%  { opacity: 1; }
      100% { opacity: 0.85; }
    }

    body.has-response #loading {
      height: 0;
      margin-top: 0;
    }

    #response {
      display: none;
      margin-top: 8px;
      max-width: 640px;
      margin-left: auto;
      margin-right: auto;
      text-align: left;
      white-space: normal;
      animation: fadeIn 300ms ease-in;
    }

    #response p {
      margin: 0.8em 0;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    body.has-response #response {
      margin-top: 0;
    }

    /* ACTION ROW — share (left) + copy (right).
       Flex-centred, so when the share button is absent (older app builds
       that never send canShare) the copy button sits centred exactly as
       it did before this feature existed. */

    #action-container {
      display: none;
      margin-top: 2em;
      justify-content: center;
      align-items: center;
      gap: 28px;
    }

    #action-container.is-visible {
      display: flex;
    }

    #copy-btn,
    #share-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px;
      color: inherit;
    }

    #copy-btn svg,
    #share-btn svg {
      width: 22px;
      height: 22px;
    }

    /* Hidden until the app announces it can handle sharing. */
    #share-btn {
      display: none;
    }

    #share-btn.is-available {
      display: inline-flex;
    }

    #action-container.is-busy #copy-btn,
    #action-container.is-busy #share-btn {
      opacity: 0.35;
      pointer-events: none;
    }

    /* STATUS LINE — sits under both buttons. */

    #share-status {
      display: none;
      margin-top: 12px;
      text-align: center;
      font-size: 1.05em;
      line-height: 1.4;
      max-width: 420px;
      margin-left: auto;
      margin-right: auto;
      opacity: 0;
      transition: opacity 300ms ease;
    }

    #share-status.is-visible {
      display: block;
      opacity: 1;
    }

    #share-status.is-working {
      animation: statusPulse 2.2s ease-in-out infinite;
    }

    @keyframes statusPulse {
      0%   { opacity: 0.45; }
      50%  { opacity: 1; }
      100% { opacity: 0.45; }
    }
  </style>
</head>

<body>
  <div id="top-center">
    <div id="listening" class="rotunda">Sister is listening...</div>

    <div id="loading">
      <img
        src="https://ninth-door.github.io/mystic-sister/assets/loading.gif?v=4"
        alt="Loading..."
      />
      <div id="loading-text" class="rotunda"></div>
    </div>
  </div>

  <div id="response"></div>

  <div id="action-container">
    <!-- SHARE -->
    <button id="share-btn" aria-label="Share this reading">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8" />
        <polyline points="16 6 12 2 8 6" />
        <line x1="12" x2="12" y1="2" y2="15" />
      </svg>
    </button>

    <!-- COPY -->
    <button id="copy-btn" aria-label="Copy this reading">
      <svg
        id="copy-icon"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <rect width="14" height="14" x="8" y="8" rx="2" />
        <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" />
      </svg>

      <svg
        id="check-icon"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        style="display: none;"
      >
        <path d="m12 15 2 2 4-4" />
        <rect width="14" height="14" x="8" y="8" rx="2" />
        <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" />
      </svg>
    </button>
  </div>

  <div id="share-status" class="rotunda"></div>

  <script>
    const preloadGIF = new Image();
    preloadGIF.src = 'https://ninth-door.github.io/mystic-sister/assets/loading.gif?v=4';

    const listeningEl = document.getElementById('listening');
    const loadingEl = document.getElementById('loading');
    const responseEl = document.getElementById('response');
    const loadingTextEl = document.getElementById('loading-text');

    const actionContainer = document.getElementById('action-container');
    const copyBtn = document.getElementById('copy-btn');
    const copyIcon = document.getElementById('copy-icon');
    const checkIcon = document.getElementById('check-icon');
    const shareBtn = document.getElementById('share-btn');
    const shareStatusEl = document.getElementById('share-status');

    let currentSister = null;
    let readingViewedSent = false;
    let isLoadingActive = false;

    /* Sharing stays invisible until the app tells us it can handle it.
       Older builds never send canShare, so on those the share button is
       never shown and the copy button sits centred, exactly as it did
       before this feature existed. */
    let canShare = false;
    let shareInFlight = false;
    let shareTimeoutId = null;

    const SHARE_TIMEOUT_MS = 30000;
    const SHARE_WORKING_TEXT = 'Sister is writing you a postcard.';
    const SHARE_SKIP_TEXT = 'Sister thinks this reading should stay between the two of you.';

    const viewedScrollThreshold = 0.85;
    const autoViewedMaxScrollablePx = 120;

    const sisterEmojiMap = {
      flower: '🌷',
      knife: '🔪',
      candle: '🕯️',
      mirror: '🪞'
    };

    function setCurrentSister(sister) {
      const key = String(sister || '').toLowerCase().trim();
      if (sisterEmojiMap[key]) currentSister = key;
    }

    function captureSister() {
      const txt = listeningEl.innerText.toLowerCase();

      if (txt.includes('flower')) currentSister = 'flower';
      else if (txt.includes('knife')) currentSister = 'knife';
      else if (txt.includes('candle')) currentSister = 'candle';
      else if (txt.includes('mirror')) currentSister = 'mirror';
    }

    function resetReadingViewedState() {
      readingViewedSent = false;
    }

    function postThunkableMessage(message) {
      try {
        if (
          window.ThunkableWebviewerExtension &&
          typeof window.ThunkableWebviewerExtension.postMessage === 'function'
        ) {
          window.ThunkableWebviewerExtension.postMessage(message);
        }
      } catch (e) {
        console.log('Thunkable postMessage failed', e);
      }
    }

    function isResponseVisible() {
      return responseEl.style.display === 'block' && responseEl.innerHTML.trim() !== '';
    }

    function getScrollMetrics() {
      const scrollTop =
        window.pageYOffset ||
        document.documentElement.scrollTop ||
        document.body.scrollTop ||
        0;

      const viewportHeight =
        window.innerHeight ||
        document.documentElement.clientHeight ||
        0;

      const docHeight = Math.max(
        document.body.scrollHeight,
        document.documentElement.scrollHeight,
        document.body.offsetHeight,
        document.documentElement.offsetHeight,
        document.body.clientHeight,
        document.documentElement.clientHeight
      );

      const totalScrollable = Math.max(docHeight - viewportHeight, 0);

      return { scrollTop, viewportHeight, docHeight, totalScrollable };
    }

    function sendReadingViewed() {
      if (readingViewedSent) return;
      readingViewedSent = true;
      postThunkableMessage('readingViewed');
    }

    function checkReadingViewed() {
      if (readingViewedSent) return;
      if (!isResponseVisible()) return;

      const { scrollTop, totalScrollable } = getScrollMetrics();

      if (totalScrollable <= autoViewedMaxScrollablePx) {
        sendReadingViewed();
        return;
      }

      const progress = totalScrollable > 0 ? (scrollTop / totalScrollable) : 0;

      if (progress >= viewedScrollThreshold) {
        sendReadingViewed();
      }
    }

    /* ---------------- SHARE STATE ---------------- */

    function enableSharing() {
      canShare = true;
      shareBtn.classList.add('is-available');
    }

    function clearShareStatus() {
      shareStatusEl.classList.remove('is-visible', 'is-working');
      shareStatusEl.textContent = '';
    }

    function showShareStatus(text, working) {
      shareStatusEl.textContent = text;
      shareStatusEl.classList.add('is-visible');
      if (working) shareStatusEl.classList.add('is-working');
      else shareStatusEl.classList.remove('is-working');

      // The user taps share from the bottom of the reading, so this line
      // appears just off-screen. Pull it into view rather than leaving them
      // to discover it by scrolling.
      try {
        shareStatusEl.scrollIntoView({ behavior: 'smooth', block: 'end' });
      } catch (e) {
        window.scrollTo(0, document.body.scrollHeight);
      }
    }

    // Called whenever the reading on screen changes, so share state from a
    // previous reading can never leak onto the next one.
    function resetShareState() {
      if (shareTimeoutId) {
        clearTimeout(shareTimeoutId);
        shareTimeoutId = null;
      }
      shareInFlight = false;
      actionContainer.classList.remove('is-busy');
      clearShareStatus();
    }

    function endShare(result) {
      if (shareTimeoutId) {
        clearTimeout(shareTimeoutId);
        shareTimeoutId = null;
      }

      shareInFlight = false;
      actionContainer.classList.remove('is-busy');

      // "skip" is the only result that leaves a message on screen — it is
      // Sister declining, and the user should see why nothing happened.
      // "ok" means the share sheet is already open, so the page goes quiet.
      // "error" is covered by the app's own alert.
      if (result === 'skip') showShareStatus(SHARE_SKIP_TEXT, false);
      else clearShareStatus();
    }

    /* Every path out of Thunkable posts shareDone, but a dropped message
       would otherwise leave this pulsing forever. */
    function beginShare() {
      if (!canShare || shareInFlight) return;

      shareInFlight = true;
      actionContainer.classList.add('is-busy');
      showShareStatus(SHARE_WORKING_TEXT, true);

      shareTimeoutId = setTimeout(() => {
        shareTimeoutId = null;
        if (shareInFlight) endShare('error');
      }, SHARE_TIMEOUT_MS);

      postThunkableMessage('share');
    }

    shareBtn.addEventListener('click', beginShare);

    /* ---------------- LOADING RITUAL ---------------- */

    const ritualLines = [
      'Sister has heard you…',
      'Don’t leave the room…',
      'Tuning into your story…',
      'Shuffling the cards…',
      'Reading the patterns…',
      'One more moment…'
    ];

    let ritualIndex = 0;
    let ritualInterval = null;

    function startRitualText() {
      stopRitualText();
      ritualIndex = 0;
      loadingTextEl.classList.remove('pulse');
      loadingTextEl.innerText = ritualLines[0];
      loadingTextEl.style.opacity = 1;

      ritualInterval = setInterval(() => {
        if (ritualIndex >= ritualLines.length - 1) {
          clearInterval(ritualInterval);
          ritualInterval = null;
          loadingTextEl.classList.add('pulse');
          return;
        }

        loadingTextEl.style.opacity = 0;
        loadingTextEl.classList.remove('pulse');

        setTimeout(() => {
          ritualIndex++;
          loadingTextEl.innerText = ritualLines[ritualIndex];
          loadingTextEl.style.opacity = 1;
        }, 600);
      }, 4800);
    }

    function stopRitualText() {
      if (ritualInterval) {
        clearInterval(ritualInterval);
        ritualInterval = null;
      }

      loadingTextEl.classList.remove('pulse');
      loadingTextEl.style.opacity = 0;
    }

    const firstListenLines = {
      flower: 'Flower is listening...',
      candle: 'Candle is listening...',
      knife: 'Knife is listening...',
      mirror: 'Mirror is listening...'
    };

    function setListeningMessage(msg) {
      document.body.classList.remove('has-response');
      listeningEl.innerHTML = msg;

      captureSister();
      resetReadingViewedState();
      isLoadingActive = false;

      listeningEl.style.display = 'block';
      loadingEl.classList.remove('is-visible');
      stopRitualText();
      responseEl.style.display = 'none';
      responseEl.innerHTML = '';
      actionContainer.classList.remove('is-visible');
      resetShareState();
    }

    function resetOracle() {
      setListeningMessage('Sister is listening...');
    }

    function showLoading() {
      if (isLoadingActive && loadingEl.classList.contains('is-visible')) return;

      document.body.classList.remove('has-response');
      resetReadingViewedState();
      isLoadingActive = true;

      listeningEl.style.display = 'none';
      loadingEl.classList.remove('is-visible');
      void loadingEl.offsetHeight;
      loadingEl.classList.add('is-visible');
      startRitualText();
      responseEl.style.display = 'none';
      responseEl.innerHTML = '';
      actionContainer.classList.remove('is-visible');
      resetShareState();
    }

    function stripOuterQuotesIfAny(s) {
      const t = s.trim();

      if (
        (t.startsWith('"') && t.endsWith('"')) ||
        (t.startsWith("'") && t.endsWith("'"))
      ) {
        try {
          return JSON.parse(t);
        } catch (e) {
          return t.slice(1, -1);
        }
      }

      return s;
    }

    function showResponse(msg, hideActions) {
      document.body.classList.add('has-response');
      resetReadingViewedState();
      isLoadingActive = false;

      listeningEl.style.display = 'none';
      loadingEl.classList.remove('is-visible');
      stopRitualText();
      responseEl.style.display = 'block';

      msg = stripOuterQuotesIfAny(String(msg ?? ''));
      msg = String(msg)
        .replace(/\\n/g, '\n')
        .replace(/\\"/g, '"');

      let cleaned = msg
        .replace(/<\/?html>/gi, '')
        .replace(/<\/?body.*?>/gi, '')
        .trim();

      const hasP = /<\s*p[\s>]/i.test(cleaned);

      if (!hasP) {
        const parts = cleaned
          .split(/\n{2,}/)
          .map((s) => s.trim())
          .filter(Boolean);

        cleaned = parts
          .map((p) => {
            const escaped = p
              .replace(/&/g, '&amp;')
              .replace(/</g, '&lt;')
              .replace(/>/g, '&gt;');

            return `<p>${escaped}</p>`;
          })
          .join('');
      } else {
        cleaned = cleaned.replace(/\n+/g, '');
      }

      responseEl.innerHTML = cleaned;

      // New reading on screen -> any previous share state is stale.
      resetShareState();

      /* Promo and tier-limit messages come through here too, but they are not
         readings — there is nothing to copy or share. They pass hideActions,
         so the action row stays hidden for them. Every existing caller passes
         one argument, so hideActions is undefined and the buttons show exactly
         as before. */
      if (!hideActions) actionContainer.classList.add('is-visible');

      setTimeout(checkReadingViewed, 80);
    }

    resetOracle();

    copyBtn.addEventListener('click', async () => {
      try {
        const emoji = sisterEmojiMap[currentSister] || '🌙';

        const finalCopy =
          emoji + ' Mystic Sister said…\n\n' +
          responseEl.innerText.trimEnd();

        await navigator.clipboard.writeText(finalCopy);

        copyIcon.style.display = 'none';
        checkIcon.style.display = 'block';

        setTimeout(() => {
          checkIcon.style.display = 'none';
          copyIcon.style.display = 'block';
        }, 1500);
      } catch (e) {
        console.log('Copy failed', e);
      }
    });

    window.addEventListener('scroll', checkReadingViewed, { passive: true });

    function handleIncomingMessage(event) {
      let data = event.data;

      if (typeof data === 'string') {
        const raw = data;
        const trimmed = raw.trim();

        const cmd = stripOuterQuotesIfAny(trimmed).trim().toLowerCase();

        if (cmd === 'loading') {
          showLoading();
          return;
        }

        if (cmd === 'reset') {
          resetOracle();
          return;
        }

        if (trimmed.startsWith('{') && trimmed.endsWith('}')) {
          try {
            data = JSON.parse(trimmed);
          } catch (e) {
            showResponse(raw);
            return;
          }
        } else {
          showResponse(raw);
          return;
        }
      }

      if (data && typeof data === 'object') {
        // canShare rides along on setSister and listeningStatus. Accept
        // boolean or string, since Thunkable can stringify object fields.
        if (data.canShare === true || data.canShare === 'true') enableSharing();

        if (data.type === 'setSister' && data.sister) {
          setCurrentSister(data.sister);
          return;
        }

        if (data.type === 'listeningStatus' && data.sister) {
          const key = String(data.sister).toLowerCase();
          setCurrentSister(key);
          const line = firstListenLines[key] || 'Sister is listening...';

          // Always keep the text current, so it is correct whenever it shows.
          listeningEl.innerHTML = line;

          /* Only take over the screen when nothing more important is on it.

             setListeningMessage() resets the whole view — it hides the loading
             GIF and stops the ritual text. That is right for a genuine reset,
             but wrong for a name update: the app posts "loading" and
             listeningStatus back to back on webviewerReady, so whichever
             arrives second wins. On a slow device that was listeningStatus,
             which silently cancelled the loading state the message before it
             had just switched on — the reading generated normally but the
             user only ever saw "Knife is listening...".

             Gating on the current state instead of trusting message order also
             stops a stray listeningStatus from wiping a reading already on
             screen. */
          if (!isLoadingActive && !document.body.classList.contains('has-response')) {
            setListeningMessage(line);
          }
          return;
        }

        /* Promo codes and weekly-limit notices arrive as a typed object rather
           than a bare string, so the page can tell them apart from a reading.
           Same renderer, same formatting — the only difference is that the
           copy and share buttons stay hidden.

           Older app builds still send these as a plain string, which takes the
           reading path further down and behaves exactly as it always has. */
        if (data.type === 'promoMessage') {
          showResponse(String(data.text ?? ''), true);
          return;
        }

        if (data.type === 'shareDone') {
          endShare(String(data.result || 'error'));
          return;
        }

        // Any other object is not for us. Returning here is deliberate:
        // falling through would hand String({...}) to showResponse and
        // paint "[object Object]" over the reading.
        return;
      }

      showResponse(String(data ?? ''));
    }

    window.addEventListener('message', handleIncomingMessage);
    document.addEventListener('message', handleIncomingMessage);

    /* Announce readiness LAST, once the listeners above are attached.

       Submitting a question toggles the page's Scrollable property, which
       makes Thunkable reload this WebViewer. On a slow device that reload
       can outlast the app's timed "loading" post, so the message arrives
       before anything is listening and the loading state never appears —
       the user sits on "Sister is listening..." for the whole generation.

       Posting this on load lets the app answer with current state: if a
       reading is still pending it re-sends "loading", and showLoading()
       ignores it when the loading state is already up. Older app builds
       have no handler for this message and simply discard it. */
    postThunkableMessage('webviewerReady');
  </script>
</body>
</html>
